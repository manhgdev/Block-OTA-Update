name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        id: release_vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          if [[ ! "$VERSION" =~ ^v([0-9]+)\.([0-9])$ ]]; then
            echo "Release tag must look like v7.1"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          VERSION_CODE="$((10#$MAJOR * 10 + 10#$MINOR))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Validate source metadata
        shell: bash
        env:
          VERSION: ${{ steps.release_vars.outputs.version }}
          VERSION_CODE: ${{ steps.release_vars.outputs.version_code }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(sed -n 's/^version=//p' module.prop | head -n 1)"
          SOURCE_CODE="$(sed -n 's/^versionCode=//p' module.prop | head -n 1)"
          [ "$SOURCE_VERSION" = "$VERSION" ] || { echo "module.prop version must equal tag"; exit 1; }
          [ "$SOURCE_CODE" = "$VERSION_CODE" ] || { echo "module.prop versionCode must equal tag number"; exit 1; }
          ruby -rjson -e '
            data = JSON.parse(File.read("update.json"))
            version, code = ARGV
            abort("update.json version must equal tag") unless data.fetch("version") == version
            abort("update.json versionCode must equal tag number") unless data.fetch("versionCode") == Integer(code)
          ' "$VERSION" "$VERSION_CODE"

      - name: Validate module scripts and safe rule set
        shell: bash
        run: |
          set -euo pipefail
          for file in *.sh system/bin/blockota; do
            sh -n "$file"
          done
          if grep -En 'iptables|ip6tables|update_engine|pm[[:space:]]+clear|kill[[:space:]]|force-stop|kill-background-processes|mount[[:space:]].*hosts' common.sh service.sh post-fs-data.sh system/bin/blockota; then
            echo "Unsafe OTA operation found"
            exit 1
          fi
          if grep -Fq 'GmsIntentOperationService' common.sh; then
            echo "Generic GMS component must not be targeted"
            exit 1
          fi
          if ! grep -Fq 'pm disable --user 0 "$c"' common.sh; then
            echo "Pixel components must use component-level disable for user 0"
            exit 1
          fi
          if grep -Fq 'COMPONENT_DUMP=' common.sh; then
            echo "Large package dumps must not be stored in shell variables"
            exit 1
          fi
          ruby -rrexml/document -e '
            doc = REXML::Document.new(File.read("ifw/block_ota_update.xml"))
            actions = REXML::XPath.match(doc, "//activity/intent-filter/action").map { |n| n.attributes["name"] }
            components = REXML::XPath.match(doc, "//activity/component-filter").map { |n| n.attributes["name"] }
            abort("IFW rule must contain exactly the manual System Update action") unless actions == ["android.settings.SYSTEM_UPDATE_SETTINGS"]
            expected_components = [
              "com.google.android.gms/.update.SystemUpdateActivity",
              "com.google.android.gms/.update.phone.PopupDialog"
            ]
            abort("IFW rule must contain exactly the Pixel System Update activity and OTA popup") unless components == expected_components
            abort("IFW rule must block the activity") unless REXML::XPath.first(doc, "//activity").attributes["block"] == "true"
          '

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r -X Block-OTA-Update.zip . \
            -x '.git/*' '.github/*' '.DS_Store' '__MACOSX/*' '*/.DS_Store' '*.bk' '*.bk1' '*.bk2'
          unzip -t Block-OTA-Update.zip
          if unzip -Z1 Block-OTA-Update.zip | grep -Eq '^(\.git|\.github)/'; then
            echo "Build archive contains repository metadata"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Block OTA Update ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: Block-OTA-Update.zip
          make_latest: true
